<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>izde-contest — Платформа стартапов и олимпиад</title>
    <!-- Подключаем Tailwind CSS для красивого минималистичного дизайна -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Подключаем клиент Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold tracking-tight text-white">izde-contest</h1>
            <p class="text-sm text-slate-400 mt-2">Платформа школьных олимпиад и стартапов</p>
        </div>

        <!-- Форма регистрации -->
        <div id="auth-form" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-400 uppercase mb-1">Электронная почта</label>
                <input type="email" id="email" required class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-indigo-500 text-sm" placeholder="name@example.com">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-400 uppercase mb-1">Пароль</label>
                <input type="password" id="password" required class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-indigo-500 text-sm" placeholder="••••••••">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-400 uppercase mb-1">Ваша роль</label>
                <select id="role" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-indigo-500 text-sm">
                    <option value="student">Школьник (Ученик)</option>
                    <option value="teacher">Учитель / Организатор</option>
                </select>
            </div>

            <button onclick="handleRegister()" class="w-full mt-2 py-3 bg-indigo-600 hover:bg-indigo-500 font-medium rounded-xl transition text-sm">
                Зарегистрироваться
            </button>
        </div>

        <!-- Блок после отправки кода (инструкция для Telegram) -->
        <div id="verify-box" class="hidden text-center space-y-4">
            <div class="p-4 bg-indigo-950/40 border border-indigo-900/50 rounded-xl">
                <p class="text-xs text-indigo-300 uppercase tracking-wider font-semibold">Ваш код подтверждения</p>
                <p id="code-display" class="text-3xl font-mono font-bold text-white tracking-widest my-2">------</p>
                <p class="text-xs text-slate-400">Отправьте этот код нашему Telegram-боту, чтобы активировать аккаунт.</p>
            </div>
            
            <a href="https://t.me/your_bot_username" target="_blank" class="inline-block w-full py-3 bg-sky-600 hover:bg-sky-500 font-medium rounded-xl transition text-sm text-center">
                Открыть Telegram-бота
            </a>
        </div>
    </div>

    <script>
        // Инициализация Supabase (замени на свои реальные ключи, если нужно)
        const SUPABASE_URL = 'https://jmiknovgrcpmlbjryckf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'; // Твой anon key
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function handleRegister() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;

            if (!email || !password) {
                alert('Заполните все поля!');
                return;
            }

            // 1. Регистрация в Supabase Auth
            const { data: authData, error: authError } = await supabaseClient.auth.signUp({
                email,
                password
            });

            if (authError) {
                alert('Ошибка регистрации: ' + authError.message);
                return;
            }

            // 2. Генерируем 6-значный код
            const code = Math.floor(100000 + Math.random() * 900000).toString();

            // 3. Сохраняем код в таблицу verifications
            const { error: verError } = await supabaseClient
                .from('verifications')
                .insert([{ email, code, used: false }]);

            if (verError) {
                alert('Ошибка создания кода: ' + verError.message);
                return;
            }

            // 4. Показываем блок с кодом пользователю
            document.getElementById('auth-form').classList.add('hidden');
            document.getElementById('verify-box').classList.remove('hidden');
            document.getElementById('code-display').textContent = code;
        }
    </script>
</body>
</html>
