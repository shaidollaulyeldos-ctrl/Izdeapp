<!DOCTYPE html>
<html lang="ru" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Izde Contest — Платформа состязаний</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #f6f8fc 0%, #e9eef6 50%, #f0f4f9 100%);
            background-attachment: fixed;
        }
        .liquid-glass { 
            background: rgba(255, 255, 255, 0.65); 
            backdrop-filter: blur(25px) saturate(180%); 
            -webkit-backdrop-filter: blur(25px) saturate(180%); 
            border: 1px solid rgba(255, 255, 255, 0.8); 
            box-shadow: 0 20px 50px rgba(0, 113, 227, 0.05);
        }
        .liquid-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0.45) 100%);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.03);
        }
        .liquid-btn {
            background: linear-gradient(135deg, #0071e3 0%, #005bb5 100%);
            box-shadow: 0 8px 20px rgba(0, 113, 227, 0.25);
        }
    </style>
</head>
<body class="text-[#1d1d1f] antialiased min-h-screen">

    <!-- Навигация -->
    <header class="fixed top-0 left-0 right-0 z-40 bg-white/70 backdrop-blur-md border-b border-white/60">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="goHome()">
                <div class="w-9 h-9 rounded-2xl liquid-btn flex items-center justify-center font-bold text-white text-base">i</div>
                <span class="font-bold text-lg text-[#1d1d1f]">izde <span class="text-[#0071e3]">contest</span></span>
            </div>
            
            <div class="flex items-center space-x-3">
                <button id="btn-create-contest" onclick="openModal('modal-contest')" class="hidden liquid-btn text-white px-4 py-2 rounded-full text-xs font-semibold items-center gap-1.5">
                    <i data-lucide="plus" class="w-4 h-4"></i> Создать
                </button>
                <div id="auth-guest-controls">
                    <button onclick="openModal('modal-auth')" class="bg-white text-[#0071e3] px-4 py-2 rounded-full text-xs font-semibold border border-[#0071e3]/20">Войти</button>
                </div>
                <div id="auth-user-controls" class="hidden flex items-center space-x-3">
                    <span id="user-display-name" class="text-xs font-bold"></span>
                    <button onclick="logout()" class="text-xs text-red-500 font-medium px-2 py-1 bg-red-50 rounded-lg">Выйти</button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 pt-28 pb-20">
        
        <!-- Экран ожидания Telegram верификации -->
        <div id="view-tg-verify" class="hidden max-w-md mx-auto text-center liquid-card p-8 rounded-3xl my-8">
            <div class="w-16 h-16 bg-blue-100 text-[#0088cc] rounded-full flex items-center justify-center mx-auto mb-4">
                <i data-lucide="send" class="w-8 h-8"></i>
            </div>
            <h2 class="text-2xl font-bold mb-2">Верификация в Telegram</h2>
            <p class="text-sm text-[#86868b] mb-4">Отправьте этот 6-значный код нашему Telegram-боту, чтобы активировать аккаунт:</p>
            
            <div class="bg-white/80 border border-blue-200 py-3 rounded-2xl text-3xl font-mono font-bold text-[#0071e3] tracking-widest mb-6 shadow-sm" id="display-verify-code">
                ------
            </div>

            <a id="tg-bot-link" href="https://t.me/verifyizde_bot" target="_blank" class="w-full bg-[#0088cc] hover:bg-[#0077b5] text-white py-3.5 rounded-xl font-semibold text-sm flex items-center justify-center gap-2 mb-3 shadow-md">
                <i data-lucide="external-link" class="w-4 h-4"></i> Открыть Telegram-бота
            </a>
            <button onclick="checkVerificationStatus()" class="w-full liquid-btn text-white py-3 rounded-xl font-semibold text-sm">Я отправил код, войти</button>
        </div>

        <!-- Главный экран -->
        <div id="view-home">
            <section class="text-center max-w-2xl mx-auto mb-12">
                <h1 class="text-4xl font-extrabold mb-3">Олимпиады и хакатоны <span class="text-[#0071e3]">Казахстана</span></h1>
                <p class="text-sm text-[#86868b]">Платформа для частных школ с защищенной верификацией через Telegram и AI-проверкой документов.</p>
            </section>
            <div class="grid md:grid-cols-2 gap-6" id="cards-container"></div>
        </div>
    </main>

    <!-- Модальное окно входа / регистрации -->
    <div id="modal-auth" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/30 backdrop-blur-md hidden">
        <div class="liquid-card p-8 rounded-3xl max-w-md w-full relative">
            <button onclick="closeModal('modal-auth')" class="absolute top-5 right-5 text-gray-400 hover:text-black"><i data-lucide="x" class="w-5 h-5"></i></button>
            <h3 class="text-xl font-bold mb-4">Регистрация / Вход</h3>
            
            <form onsubmit="handleAuth(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold mb-1">Имя и Фамилия</label>
                    <input id="auth-fullname" type="text" placeholder="Елдос Шайдолла" class="w-full bg-white/70 border rounded-xl px-4 py-2.5 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1">Уникальный @username</label>
                    <input id="auth-username" type="text" placeholder="@eldos_sh" class="w-full bg-white/70 border rounded-xl px-4 py-2.5 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1">Email</label>
                    <input id="auth-email" type="email" required placeholder="name@school.kz" class="w-full bg-white/70 border rounded-xl px-4 py-2.5 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1">Пароль</label>
                    <input id="auth-password" type="password" required placeholder="••••••••" class="w-full bg-white/70 border rounded-xl px-4 py-2.5 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1">Роль</label>
                    <select id="auth-role" onchange="toggleTeacherDocUpload()" class="w-full bg-white/70 border rounded-xl px-4 py-2.5 text-sm">
                        <option value="student">Ученик</option>
                        <option value="teacher">Учитель / Организатор</option>
                    </select>
                </div>

                <div id="teacher-doc-box" class="hidden p-3 bg-blue-50/50 border border-blue-200 rounded-xl space-y-2">
                    <label class="block text-xs font-bold text-[#0071e3]">AI Сканирование Удостоверения</label>
                    <input type="file" id="teacher-doc-file" accept="image/*" class="w-full text-xs">
                </div>

                <button type="submit" class="w-full liquid-btn text-white py-3 rounded-xl font-semibold text-sm">Продолжить</button>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://jmiknovgrcpmlbjryckf.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_DwZo8Qdi5uFAttkCn4OD7A_Lnx30kf5';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        lucide.createIcons();

        function generateCode() {
            return Math.floor(100000 + Math.random() * 900000).toString();
        }

        function toggleTeacherDocUpload() {
            const role = document.getElementById('auth-role').value;
            document.getElementById('teacher-doc-box').classList.toggle('hidden', role !== 'teacher');
        }

        async function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value;
            const fullName = document.getElementById('auth-fullname').value.trim();
            const username = document.getElementById('auth-username').value.trim().replace('@','');
            const role = document.getElementById('auth-role').value;
            const code = generateCode();

            if (!fullName || !username) {
                alert('Заполните Имя и @username!');
                return;
            }

            // AI проверка для учителя
            if (role === 'teacher') {
                const fileInput = document.getElementById('teacher-doc-file');
                if (!fileInput.files.length) {
                    alert('Загрузите фото удостоверения для подтверждения роли учителя!');
                    return;
                }
                const worker = await Tesseract.createWorker('rus+kaz+eng');
                const ret = await worker.recognize(fileInput.files[0]);
                await worker.terminate();
                if (ret.data.text.trim().length < 10) {
                    alert('AI не смог распознать текст на документе. Загрузите чёткое фото.');
                    return;
                }
            }

            const { data, error } = await supabaseClient.auth.signUp({
                email, password,
                options: { 
                    data: { 
                        full_name: fullName, 
                        username: username, 
                        role: role, 
                        verify_code: code, 
                        tg_verified: false 
                    } 
                }
            });

            if (error) {
                alert(error.message);
                return;
            }

            document.getElementById('display-verify-code').innerText = code;
            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-tg-verify').classList.remove('hidden');
            closeModal('modal-auth');
        }

        async function checkVerificationStatus() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                const { data: userObj } = await supabaseClient.auth.admin.getUserById(session.user.id);
                // Проверяем статус в базе
                window.location.reload();
            } else {
                alert('Сначала войдите или завершите верификацию у бота в Telegram!');
            }
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    </script>
</body>
</html>
